name: Publish

# Release publishing via npm Trusted Publishing (OIDC): the run mints an
# OIDC token that npm matches against each package's Trusted Publisher
# config on npmjs.com (repo + this workflow file). No npm token secret
# exists or is needed. Provenance attestations are generated automatically
# for public repositories.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Mint the OIDC token npm authenticates (required; docs.npmjs.com/trusted-publishers)
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The workspace builds against a local DeepSeek Harness checkout:
      # clone it as the sibling directory `npm run bootstrap` expects.
      # Pinned to the release line this plugin is certified against (README
      # compatibility note) — bump together with the README when re-certifying.
      - name: Check out DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.2-alpha.2
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: deepseek-harness/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml

      # Trusted publishing requires npm >= 11.5.1; Node 22 images ship npm 10.x.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Build DeepSeek Harness (provides toolchain + resolution facade)
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HOST_VERSION=$(node -p "require('./packages/scheduled-task/host/package.json').version")
          [ "$TAG" = "$HOST_VERSION" ] || { echo "tag v$TAG != manifest version $HOST_VERSION — bump the four manifests first"; exit 1; }

      - name: Build gates (browser bundles ship in the tarballs)
        run: |
          npm run bootstrap
          npm run build
          npm run build:web
          npm test
          npm run verify

      # Order matters: the bundle depends on the three halves, so it ships last.
      # Auth: if the NPM_TOKEN secret exists (bootstrap phase — the packages are
      # not yet on npm, so no Trusted Publisher config can exist) publish with
      # it; otherwise fall through to OIDC trusted publishing (steady state,
      # once each package's npm Settings → Trusted Publisher points here).
      - name: Publish host → remotes → client → bundle
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # OIDC triage: npm silently skips trusted publishing (and later fails
          # with ENEEDAUTH) both when the runner withheld the id-token
          # permission and when the npm-side exchange rejects the workflow
          # (e.g. trusted publishing requires a PUBLIC GitHub repository).
          echo "npm $(npm --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+SET}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+SET}"
          # Ask the registry directly why the exchange rejects us: npm buries
          # this error and surfaces only ENEEDAUTH on the publish command.
          idtok=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write((JSON.parse(d).value)||''))")
          if [ -n "$idtok" ]; then
            for enc in '%2F' '%2f'; do
              code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' -X POST \
                "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@qihongmu${enc}dsh-plugins-scheduled-task" \
                -H "Authorization: Bearer $idtok" -H "Content-Type: application/json")
              echo "exchange $enc -> $code $(head -c 300 /tmp/probe.json)"
            done
          else
            echo "no id token minted"
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          fi
          for p in host remotes client bundle; do
            dir="./packages/scheduled-task/$p"
            v=$(node -p "require('$dir/package.json').version")
            # npm refuses to stamp a prerelease as `latest` without an explicit
            # tag; ship those under the `alpha` dist-tag (mirrors the dsh line
            # the release is certified against).
            case "$v" in
              *-*) tag="--tag alpha" ;;
              *)   tag="" ;;
            esac
            npm publish --access public $tag "$dir"
          done
