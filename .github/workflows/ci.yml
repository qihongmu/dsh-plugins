name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace builds against a local DeepSeek Harness checkout:
      # clone it as the sibling directory `npm run bootstrap` expects.
      - name: Check out DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      # Read the pinned pnpm version from the UPSTREAM manifest — this repo has
      # no packageManager of its own (pnpm/action-setup only understands the
      # `package_json_file` input; a job-level working-directory is ignored).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: deepseek-harness/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml

      - name: Build DeepSeek Harness (provides toolchain + resolution facade)
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Bootstrap plugin workspace
        run: npm run bootstrap

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Remote surface verify
        run: npm run verify
